{% extends "brews/base.html" %}

{% block title %}YeastMode - Log in{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-4">Welcome back</h1>
        <form method="post">
            {% csrf_token %}
            {% include "brews/partials/form_fields.html" %}
            <div class="form-actions">
                <a href="javascript:history.back()" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-primary">Log in</button>
            </div>
        </form>
        <p class="form-footer">New to YeastMode? <a href="{% url 'signup' %}">Create an account</a></p>
    </div>
</div>
{% endblock %}
