<section class="board-column" id="column-{{ status }}" data-status="{{ status }}" aria-labelledby="column-{{ status }}-title">
    <div class="board-column-header">
        <span id="column-{{ status }}-title"><span class="dot dot-{{ status }}"></span>{{ label }}</span>
        <span class="count">{{ sessions|length }}</span>
    </div>
    <div class="board-cards" data-status="{{ status }}">
        {% for session in sessions %}
            {% include "brews/partials/brew_card.html" %}
        {% endfor %}
        <div class="board-empty"{% if sessions %} hidden{% endif %}>Nothing here yet</div>
    </div>
</section>
