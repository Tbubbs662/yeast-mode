{% extends "brews/base.html" %}

{% block title %}YeastMode - {{ title }}{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-4">{{ title }}</h1>
        <form method="post">
            {% csrf_token %}
            {% include "brews/partials/form_fields.html" %}
            <div class="form-actions">
                <a href="{% url 'session_detail' session.pk %}" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-primary">Save</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
