{% extends "brews/base.html" %}

{% block title %}YeastMode - {{ recipe.name }}{% endblock %}

{% block content %}
<div class="card form-card">
    <div class="card-body p-4 p-md-5">
        <div class="mb-3"><i class="bi bi-exclamation-triangle fs-2 text-danger"></i></div>
        <h1 class="h3 mb-3">Delete {{ recipe.name }}?</h1>
        <p class="text-muted">You are about to permanently delete <strong class="text-body">{{ recipe.name }}</strong> and all of its brew sessions. This cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions">
                <a href="javascript:history.back()" class="btn btn-ghost">Cancel</a>
                <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Delete</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
