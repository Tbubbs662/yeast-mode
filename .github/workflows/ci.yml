name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Same Postgres version as docker-compose.yml.
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: yeastmode
          POSTGRES_USER: yeastmode_user
          POSTGRES_PASSWORD: yeastmode_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yeastmode_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://yeastmode_user:yeastmode_pass@localhost:5432/yeastmode
      SECRET_KEY: ci-only-secret-key
      DEBUG: "False"

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      # Same Python version as app/Dockerfile.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --verbosity 2
